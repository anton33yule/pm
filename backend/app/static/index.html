<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Project Management MVP</title>
  </head>
  <body>
    <h1>Project Management MVP</h1>
    <p id="message">Loading...</p>
    <script>
      fetch("/api/hello")
        .then((response) => response.json())
        .then((data) => {
          document.getElementById("message").textContent = data.message;
        });
    </script>
  </body>
</html>
